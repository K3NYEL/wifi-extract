      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mobile Network Analyzer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            MobileNetworkAnalyzer-${{ github.ref_name }}-android.apk
            MobileNetworkAnalyzer-${{ github.ref_name }}-android.apk.sha256
          fail_on_unmatched_files: true

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK="MobileNetworkAnalyzer-${GITHUB_REF_NAME}-android.apk"
          CHECKSUM="$APK.sha256"
          VERIFY_DIR="$RUNNER_TEMP/release-verification"
          mkdir -p "$VERIFY_DIR"

          RELEASE_JSON="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,assets)"
          echo "$RELEASE_JSON" | jq -e '
            .isDraft == false and
            ([.assets[].name] | index(env.APK) != null)
          ' >/dev/null

          echo "$RELEASE_JSON" | jq -e --arg apk "$APK" --arg checksum "$CHECKSUM" '
            ([.assets[].name] | index($apk) != null) and
            ([.assets[].name] | index($checksum) != null) and
            ([.assets[] | select(.name == $apk or .name == $checksum) | select(.size > 0)] | length == 2)
          ' >/dev/null

          gh release download "$GITHUB_REF_NAME" \
            --pattern "$APK" \
            --pattern "$CHECKSUM" \
            --dir "$VERIFY_DIR"

          cd "$VERIFY_DIR"
          sha256sum --check "$CHECKSUM"
          unzip -t "$APK" >/dev/null

          echo "Release verification passed: assets exist, checksum matches, and APK archive is valid."
