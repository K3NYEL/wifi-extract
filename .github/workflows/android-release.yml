
name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          }

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mna-release.jks"
          test -s "$RUNNER_TEMP/mna-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mna-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret"
            exit 1
          }

          test -n "$ANDROID_KEY_ALIAS" || {
            echo "::error::Missing ANDROID_KEY_ALIAS secret"
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "::error::Missing ANDROID_KEY_PASSWORD secret"
            exit 1
          }

          gradle :app:assembleRelease

      - name: Prepare release files and checksum
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK="MobileNetworkAnalyzer-${GITHUB_REF_NAME}-android.apk"

          test -s "$APK_SOURCE" || {
            echo "::error::Release APK not found or empty: $APK_SOURCE"
            exit 1
          }

          cp "$APK_SOURCE" "$APK"
          sha256sum "$APK" > "$APK.sha256"

          test -s "$APK"
          test -s "$APK.sha256"

          unzip -t "$APK" >/dev/null

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mobile Network Analyzer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            MobileNetworkAnalyzer-${{ github.ref_name }}-android.apk
            MobileNetworkAnalyzer-${{ github.ref_name }}-android.apk.sha256
          fail_on_unmatched_files: true

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK="MobileNetworkAnalyzer-${GITHUB_REF_NAME}-android.apk"
          CHECKSUM="$APK.sha256"
          VERIFY_DIR="$RUNNER_TEMP/release-verification"

          mkdir -p "$VERIFY_DIR"

          RELEASE_JSON="$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets)"

          echo "$RELEASE_JSON" | jq -e '.isDraft == false' >/dev/null

          echo "$RELEASE_JSON" | jq -e \
            --arg apk "$APK" \
            --arg checksum "$CHECKSUM" '
              ([.assets[].name] | index($apk) != null) and
              ([.assets[].name] | index($checksum) != null) and
              ([.assets[] | select(.name == $apk or .name == $checksum) |
                select(.size > 0)] | length == 2)
            ' >/dev/null

          gh release download "$GITHUB_REF_NAME" \
            --pattern "$APK" \
            --pattern "$CHECKSUM" \
            --dir "$VERIFY_DIR"

          cd "$VERIFY_DIR"

          sha256sum --check "$CHECKSUM"
          unzip -t "$APK" >/dev/null

          echo "Release verification passed."
